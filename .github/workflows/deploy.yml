name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/your-github-username

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build DBService
      - name: Build DBService
        uses: docker/build-push-action@v6
        with:
          context: ./dbservice
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/dbservice:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/dbservice:latest

      # Build AuthService
      - name: Build AuthService
        uses: docker/build-push-action@v6
        with:
          context: ./authservice
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/authservice:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/authservice:latest

      # Build InventoryService
      - name: Build InventoryService
        uses: docker/build-push-action@v6
        with:
          context: ./inventoryservice
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/inventoryservice:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/inventoryservice:latest

      # SSH setup
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

      # Prepare server directories
      - name: Prepare server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p /opt/myproject/dbservice /opt/myproject/authservice"

      # Copy deployment files
      - name: Copy deployment files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          scp -P "${SSH_PORT:-22}" \
            stack.yaml \
            "$SSH_USER@$SSH_HOST:/opt/myproject/"

          scp -r -P "${SSH_PORT:-22}" \
            postgres nginx \
            "$SSH_USER@$SSH_HOST:/opt/myproject/"

          scp -r -P "${SSH_PORT:-22}" \
            dbservice/migrations \
            "$SSH_USER@$SSH_HOST:/opt/myproject/dbservice/"

          scp -r -P "${SSH_PORT:-22}" \
            authservice/migrations \
            "$SSH_USER@$SSH_HOST:/opt/myproject/authservice/"

      # Deploy infrastructure, run migrations, deploy applications
      - name: Deploy to Docker Swarm
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_TAG: ${{ github.sha }}
        run: |
          ssh -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_TAG='${DEPLOY_TAG}' bash -s" <<'REMOTE'

          set -Eeuo pipefail

          cd /opt/myproject

          # Load server environment variables
          set -a
          . ./.env
          set +a

          export TAG="$DEPLOY_TAG"

          # Generate versioned Docker config names
          export INITDB_CONFIG_VERSION=$(
            sha256sum postgres/init-databases.sh | cut -c1-12
          )

          export NGINX_CONFIG_VERSION=$(
            sha256sum nginx/nginx.conf | cut -c1-12
          )

          # Stage 1: Start infrastructure without Go services
          echo "Deploying infrastructure..."

          export APP_REPLICAS=0

          docker stack deploy \
            --with-registry-auth \
            -c stack.yaml \
            "$STACK_NAME"

          # Stage 2: Wait for PostgreSQL
          echo "Waiting for PostgreSQL..."

          for attempt in $(seq 1 60); do
            if docker run --rm \
              --network "${STACK_NAME}_app-network" \
              postgres:16-alpine \
              pg_isready \
                -h postgres \
                -U "$POSTGRES_USER" \
                -d postgres \
                >/dev/null 2>&1
            then
              echo "PostgreSQL is ready."
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "PostgreSQL did not become ready."
              exit 1
            fi

            sleep 2
          done

          # Stage 3: Run DBService migrations
          echo "Running DBService migrations..."

          docker run --rm \
            --network "${STACK_NAME}_app-network" \
            -v /opt/myproject/dbservice/migrations:/migrations:ro \
            migrate/migrate:4 \
            -path=/migrations \
            -database "$DB_CONNECT" \
            up

          # Stage 4: Run AuthService migrations
          echo "Running AuthService migrations..."

          docker run --rm \
            --network "${STACK_NAME}_app-network" \
            -v /opt/myproject/authservice/migrations:/migrations:ro \
            migrate/migrate:4 \
            -path=/migrations \
            -database "$AUTH_CONNECT" \
            up

          # Stage 5: Start Go services
          echo "Deploying Go services..."

          export APP_REPLICAS=1

          docker stack deploy \
            --with-registry-auth \
            -c stack.yaml \
            "$STACK_NAME"

          echo "Deployment completed successfully."

          REMOTE