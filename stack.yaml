services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      AUTH_DB: ${AUTH_DB}
      APP_DB: ${APP_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    configs:
      - source: init-databases
        target: /docker-entrypoint-initdb.d/init-databases.sh
        mode: 0555

    networks:
      app-network:
        aliases:
          - postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    deploy:
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}

    networks:
      app-network:
        aliases:
          - redis

    deploy:
      restart_policy:
        condition: on-failure

  dbservice:
    image: ${REGISTRY}/dbservice:${TAG}

    environment:
      PORT: ${DB_PORT}
      CONNECT: ${DB_CONNECT}

    networks:
      app-network:
        aliases:
          - dbservice

    deploy:
      restart_policy:
        condition: on-failure

  authservice:
    image: ${REGISTRY}/authservice:${TAG}

    environment:
      PORT: ${AUTH_PORT}
      CONNECT: ${AUTH_CONNECT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_TTL: ${JWT_TTL}
      DBSERVICE_URL: ${DBSERVICE_URL}
      MIGRATE_VERSION: ${AUTH_SERVICE_MIGRATE_VERSION}

    networks:
      app-network:
        aliases:
          - authservice

    deploy:
      restart_policy:
        condition: on-failure

  inventoryservice:
    image: ${REGISTRY}/inventoryservice:${TAG}

    environment:
      PORT: ${INVENTORY_PORT}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DBSERVICE_URL: ${DBSERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}

    networks:
      app-network:
        aliases:
          - inventoryservice

    deploy:
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress

    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
        mode: 0444

    networks:
      - app-network

    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres-data:

configs:
  init-databases:
    name: ${STACK_NAME}_init-databases_${INITDB_CONFIG_VERSION}
    file: ./postgres/init-databases.sh

  nginx-config:
    name: ${STACK_NAME}_nginx-config_${NGINX_CONFIG_VERSION}
    file: ./nginx/nginx.conf

networks:
  app-network:
    driver: overlay
    attachable: true